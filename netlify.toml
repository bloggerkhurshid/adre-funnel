[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/create-cashfree-order"
  to = "/.netlify/functions/create-cashfree-order"
  status = 200

[[redirects]]
  from = "/api/send-order-email"
  to = "/.netlify/functions/send-order-email"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Ultra Dark Tech Slate -->
    <linearGradient id="bgSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030816" />
      <stop offset="45%" stop-color="#06122c" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Facebook Electric Blue Gradient -->
    <linearGradient id="fbBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#1877F2" />
      <stop offset="100%" stop-color="#0d52b9" />
    </linearGradient>

    <!-- Emerald Cash Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Amber Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="fbGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1877F2" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cashGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" rx="20" fill="url(#bgSlate)" />
  <rect width="596" height="796" x="2" y="2" rx="18" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="500" cy="180" r="220" fill="url(#fbGlow)" />
  <circle cx="120" cy="650" r="180" fill="url(#cashGlow)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="500" x2="600" y2="500" />
    <line x1="0" y1="600" x2="600" y2="600" />
    <line x1="0" y1="700" x2="600" y2="700" />
    <line x1="150" y1="0" x2="150" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="450" y1="0" x2="450" y2="800" />
  </g>

  <!-- Top Status Pill -->
  <g transform="translate(50, 45)">
    <rect width="240" height="32" rx="16" fill="rgba(24, 119, 242, 0.18)" stroke="#1877F2" stroke-opacity="0.6" stroke-width="1.5" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="35" y="21" fill="#e0f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">COMPLETE 2026 BLUEPRINT</text>
  </g>

  <!-- Top Right Year Badge -->
  <g transform="translate(470, 45)">
    <rect width="80" height="32" rx="8" fill="rgba(16, 185, 129, 0.18)" stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="40" y="21" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">10+ HRS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(50, 135)">
    <text x="0" y="0" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="3">USA AUDIENCE MONETIZATION</text>
    
    <text x="0" y="55" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">FACEBOOK</text>
    <text x="0" y="112" fill="url(#fbBlueGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">EARNING</text>
    <text x="0" y="165" fill="url(#goldGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">MASTERCLASS</text>

    <!-- Subtitle divider -->
    <rect x="0" y="185" width="500" height="2" fill="url(#fbBlueGrad)" opacity="0.6" />
    <text x="0" y="210" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ZERO SE 7-FIGURE TAK • FULL SYSTEM PLAYBOOK</text>
  </g>

  <!-- Center Card: 3 Core Pillars -->
  <g transform="translate(50, 380)">
    <rect width="500" height="195" rx="14" fill="rgba(10, 25, 55, 0.65)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    
    <!-- Pillar 1 -->
    <g transform="translate(24, 25)">
      <circle cx="16" cy="16" r="16" fill="rgba(24, 119, 242, 0.25)" />
      <text x="16" y="22" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">📍</text>
      <text x="44" y="15" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">USA Group Sharing</text>
      <text x="44" y="32" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Ban-Proof Posting &amp; Safe Limits</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(24, 80)">
      <circle cx="16" cy="16" r="16" fill="rgba(16, 185, 129, 0.25)" />
      <text x="16" y="22" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">💰</text>
      <text x="44" y="15" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">Paid Ad Method</text>
      <text x="44" y="32" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">$10-20 Budget se ROI-Positive Views</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(24, 135)">
      <circle cx="16" cy="16" r="16" fill="rgba(245, 158, 11, 0.25)" />
      <text x="16" y="22" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">🤖</text>
      <text x="44" y="15" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">AI Automation &amp; TV Shows</text>
      <text x="44" y="32" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">1 Din Mein 10 Pages Content (Copyright-Safe)</text>
    </g>
  </g>

  <!-- Bottom Payout Proof Banner -->
  <g transform="translate(50, 600)">
    <rect width="500" height="90" rx="14" fill="rgba(6, 78, 59, 0.35)" stroke="#10B981" stroke-width="1.5" />
    <g transform="translate(24, 25)">
      <text x="0" y="18" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">VERIFIED IN-STREAM PAYOUT</text>
      <text x="0" y="48" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900">$15,353.41</text>
      <text x="180" y="45" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">(₹12,80,000+ In 1 Month)</text>
    </g>
    <g transform="translate(380, 24)">
      <rect width="95" height="42" rx="8" fill="rgba(16, 185, 129, 0.3)" />
      <text x="48" y="26" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">PAID ✓</text>
    </g>
  </g>

  <!-- Bottom Badges Row -->
  <g transform="translate(50, 725)">
    <text x="0" y="18" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">13 Modules</text>
    <circle cx="80" cy="14" r="3" fill="#334155" />
    <text x="95" y="18" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Action Checklists</text>
    <circle cx="215" cy="14" r="3" fill="#334155" />
    <text x="230" y="18" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">VIP WhatsApp Group</text>
    <circle cx="380" cy="14" r="3" fill="#334155" />
    <text x="395" y="18" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Lifetime Updates</text>
  </g>
</svg>

